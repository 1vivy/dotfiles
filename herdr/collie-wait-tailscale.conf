# Drop-in for the installer-owned collie.service. A member binds COLLIE_HOST (its tailnet
# address), which exists only after tailscaled connects. Started earlier, the bridge logs
# EADDRNOTAVAIL, keeps running without a listener, and is never restarted. Wait for the address;
# if it never appears, the start timeout fails the unit and Restart=on-failure retries.
[Service]
ExecStartPre=/bin/sh -c 'until [ -z "$$COLLIE_HOST" ] || ip -o addr show to "$$COLLIE_HOST" | grep -q .; do sleep 1; done'
