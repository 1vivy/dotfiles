# Same behavior on Linux/macOS, regardless of the tmux version's defaults.
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
set -g default-terminal tmux-256color

# Preserve modified keys when a TUI requests them; leave legacy apps in legacy mode.
set -s extended-keys on
%if #{>=:#{version},3.5}
set -s extended-keys-format csi-u
%endif

# Copy through the attached terminal (OSC 52), not a server-side clipboard tool.
# external permits tmux copies without accepting application clipboard writes.
set -s set-clipboard external
set -as terminal-features ',xterm-ghostty:RGB:clipboard:extkeys,wezterm:RGB:clipboard:extkeys,xterm-kitty:RGB:clipboard:extkeys'

# Keep C-b and standard wheel bindings: shell history goes into copy-mode;
# mouse-aware applications receive their own wheel events.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Match the terminal's Cmd/Ctrl-Shift + 1..9 shortcuts. No icon font required.
set -g base-index 1
setw -g pane-base-index 1
set -g status-left '[#h:#S] '
set -g status-left-length 40
set -g status-right '%H:%M %Y-%m-%d'
